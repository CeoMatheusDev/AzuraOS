name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The exact toolchain the project is validated against. The distribution
  # package is NOT used: the Fedora 44 package is Zig 0.16.0, and the project
  # requires 0.17.0 exactly (see docs/TOOLCHAIN.md).
  ZIG_VERSION: '0.17.0'
  ZIG_ARCHIVE: zig-x86_64-linux-0.17.0.tar.xz
  ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz

jobs:
  build-and-test:
    name: Build and test (x86_64, Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the system packages
        run: |
          dnf install -y \
            qemu-system-x86 \
            edk2-ovmf \
            mtools \
            binutils \
            file \
            coreutils \
            findutils \
            python3 \
            tar \
            xz \
            curl \
            ca-certificates

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$ZIG_ARCHIVE" "$ZIG_URL"
          # The checksum comes from the official release index and is checked
          # by the project's own script, so the CI and the developer use the
          # same verification.
          bash "$GITHUB_WORKSPACE/tools/verify-zig-release.sh" "$PWD/$ZIG_ARCHIVE"
          tar -xf "$ZIG_ARCHIVE"
          echo "$RUNNER_TEMP/zig-$ZIG_VERSION" >> "$GITHUB_PATH"
          echo "ZIG_VERSION=$ZIG_VERSION" >> "$GITHUB_ENV"

      - name: Check the toolchain
        run: |
          set -euo pipefail
          echo "zig version: $(zig version)"
          if [[ "$(zig version)" != "$ZIG_VERSION" ]]; then
            echo "ERROR: expected Zig $ZIG_VERSION, got $(zig version)" >&2
            exit 1
          fi

      - name: Report the toolchain
        run: |
          bash tools/fedora-m01-report.sh || true
          bash tools/check-toolchain.sh || true

      - name: Build both artifacts
        run: zig build

      - name: Run the unit tests
        run: zig build unit-test

      - name: Run the toolchain tests
        run: |
          bash tests/toolchain/test-verify-zig-release.sh
          bash tests/toolchain/test-host-diagnostics.sh
          bash tests/toolchain/test-fedora-m01-report.sh
          bash tests/build/test-check-kernel-elf.sh
          bash tests/build/test-check-kernel-elf-positive.sh

      - name: Run the QEMU boot test
        run: zig build boot-test

      - name: Run the QEMU fault handler test
        run: zig build fault-test

      - name: Upload the boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-boot-evidence
          path: |
            zig-out/boot/serial.log
            zig-out/boot/screen.png
            zig-out/test-boot/
            zig-out/test-fault/
          if-no-files-found: warn

  formatting:
    name: zig fmt
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$ZIG_ARCHIVE" "$ZIG_URL"
          bash "$GITHUB_WORKSPACE/tools/verify-zig-release.sh" "$PWD/$ZIG_ARCHIVE"
          tar -xf "$ZIG_ARCHIVE"
          echo "$RUNNER_TEMP/zig-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Check the formatting
        run: |
          set -euo pipefail
          echo "zig version: $(zig version)"
          zig fmt --check boot kernel shared tools
